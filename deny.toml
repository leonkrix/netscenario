# Supply chain policy, checked by `cargo deny check` (just deny) and on the CI (QA-08).

[graph]
all-features = true

[advisories]
# A crate with a known vulnerability, or one that was yanked, stops the build
yanked = "deny"

[licenses]
# Permissive licences only (the project is MIT OR Apache-2.0, D-003). A new licence is a decision: add it
# here in the pull request that brings the dependency, with the reason.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# The list names licences that no dependency uses yet; that is not a warning
unused-allowed-license = "allow"

[bans]
# Two versions of one crate are allowed but visible
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
