name: Set up the toolchain
description: Rust (with the cache), the pinned command line tools, and optionally uv with a Python version

inputs:
  toolchain:
    description: The Rust toolchain, `stable` or an exact version such as 1.89.0
    default: stable
  tools:
    description: Command line tools to install with their exact versions (taiki-e/install-action syntax)
    default: just@1.40.0,cargo-nextest@0.9.150,cargo-deny@0.20.2
  python:
    description: A Python version for uv (for example 3.12); empty means no uv
    default: ''
  cache-key:
    description: >-
      Jobs that build the same things share one cache by giving the same name here; empty means one cache for each job.
      The cache of a repository is limited to 10 GB, and a cache for each job fills it.
    default: ''

runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for every later step of the job
        echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.toolchain }}
        shared-key: ${{ inputs.cache-key }}
    - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
      with:
        tool: ${{ inputs.tools }}
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      if: inputs.python != ''
      with:
        python-version: ${{ inputs.python }}
        enable-cache: true
        cache-dependency-glob: uv.lock
