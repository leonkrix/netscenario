name: Book

# The guide (docs/book) is built on every pull request that touches it or the files it includes, and published to GitHub Pages
# from main. The scenarios, the Python and the links of the book are checked by the tests of the CI (python/netscenario/tests/test_book.py);
# this workflow builds the pages with mdBook and fails on a warning of the build.

on:
  pull_request:
    paths:
      - 'docs/book/**'
      - 'scenarios/**'
      - 'examples/**'
      - '.github/workflows/book.yml'
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - 'scenarios/**'
      - 'examples/**'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: Build the book
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - name: Build
        run: |
          mdbook build docs/book 2>&1 | tee build.log
          # mdBook reports a missing include or a broken page as a warning or an error and goes on
          if grep -E ' (WARN|ERROR) ' build.log; then
            echo '::error::the book builds with warnings'
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/book/book

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
