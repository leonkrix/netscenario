name: Spikes

# Runs the experiments of spikes/ on GitHub's runners, to see what their kernels allow.
# By hand only. The results are in the log of the run and in the artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spikes:
    name: Spikes on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping python3
      # Three cases: as the runner user with the defaults of the image, as root, and as the runner
      # user after relaxing the AppArmor rule that blocks unprivileged user namespaces on Ubuntu 24.04.
      - name: Run the spikes as an unprivileged user
        run: bash spikes/run-all.sh
        continue-on-error: true
      - name: Run the spikes as root
        run: sudo SPIKE_OUT="$PWD/spikes/out-root" bash spikes/run-all.sh
        continue-on-error: true
      - name: Run the spikes as an unprivileged user, AppArmor restriction off
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          SPIKE_OUT="$PWD/spikes/out-relaxed" bash spikes/run-all.sh
        continue-on-error: true
      # S2 asked for `netem ... seed`, which neither iproute2 5.15 (22.04) nor 6.1.0 (24.04) knows.
      # Build the current iproute2 and run S2 with it, to separate "old tool" from "old kernel".
      - name: S2 with a current tc built from source
        run: |
          sudo apt-get install -y --no-install-recommends bison flex pkg-config libelf-dev libmnl-dev build-essential git ca-certificates
          git clone --depth 1 https://git.kernel.org/pub/scm/network/iproute2/iproute2.git "$RUNNER_TEMP/iproute2"
          echo "iproute2 commit: $(git -C "$RUNNER_TEMP/iproute2" rev-parse HEAD)"
          make -C "$RUNNER_TEMP/iproute2" -j"$(nproc)"
          "$RUNNER_TEMP/iproute2/tc/tc" -V
          mkdir -p "$PWD/spikes/out-newtc"
          sudo env PATH="$RUNNER_TEMP/iproute2/tc:$PATH" SPIKE_OUT="$PWD/spikes/out-newtc" bash spikes/s2-netem-seed.sh
        continue-on-error: true
      - name: Which options does tc know?
        run: |
          tc -V || true
          ip -V || true
          # The words the tc binary contains for netem (the kernel side is tested by S2)
          strings "$(command -v tc)" | grep -ix 'seed' || echo "the word 'seed' is not in the tc binary"
        continue-on-error: true
      # The Rust and Python experiments (S7 to S10) run as the runner user. On Ubuntu 24.04 the AppArmor
      # restriction was relaxed by the step above, and the setting stays for the rest of the job.
      - name: S10 Toolchain of this image
        run: |
          mkdir -p spikes/out-rust
          {
            echo "kernel: $(uname -r)"
            echo "cpus: $(nproc), $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            rustc --version
            cargo --version
            rustup --version 2>&1 | head -n 1
            cargo clippy --version
            rustfmt --version
            python3 --version
            python3 -c 'import venv, sys; print("venv module ok")'
            gcc --version | head -n 1
            ldd --version | sed -n 1p
            docker --version
            ip -V
          } 2>&1 | tee spikes/out-rust/s10.txt
        continue-on-error: true
      - name: S7 Netlink (nlink) against tc
        run: |
          mkdir -p spikes/out-rust
          bash spikes/rust-netlink/run.sh 2>&1 | tee spikes/out-rust/s7.txt
        continue-on-error: true
      - name: S9 PyO3 and maturin
        run: |
          mkdir -p spikes/out-rust
          bash spikes/rust-pyo3/run.sh 2>&1 | tee spikes/out-rust/s9.txt
        continue-on-error: true
      # The engine series pins three cores; on a runner with fewer than four it is skipped. A shared virtual
      # machine is noisier than a development machine, which is the point of running it here as well.
      - name: S8 Packet engine
        run: |
          mkdir -p spikes/out-rust
          if [ "$(nproc)" -lt 4 ]; then
            echo "fewer than 4 CPUs: S8 skipped" | tee spikes/out-rust/s8.txt
            exit 0
          fi
          SECS=4 CORE_ENGINE=1 CORE_RECV=2 CORE_SEND=3 bash spikes/rust-engine/run.sh 2>&1 | tee spikes/out-rust/s8.txt
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spikes-${{ matrix.os }}
          path: |
            spikes/out/
            spikes/out-root/
            spikes/out-relaxed/
            spikes/out-newtc/
            spikes/out-rust/
