name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  fmt:
    name: Format (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0
      - run: just fmt-check

  clippy:
    name: Lints (clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0
      - run: just clippy

  # The tests run on both Ubuntu images that the project supports and with the current stable Rust and
  # with the lowest supported one (rust-version in Cargo.toml, 1.89)
  test:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        rust: [stable, 1.89.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ matrix.rust }}
          tools: just@1.40.0,cargo-nextest@0.9.150
      # A tc that knows the seed of netem, and the permission to create user namespaces
      - uses: ./.github/actions/namespaces
      - run: just test
      # What the fidelity tests measured on this runner (QA-06, docs/FIDELITY.md): one table for each test job,
      # to be compared with the table in the repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fidelity-${{ matrix.os }}-rust-${{ matrix.rust }}
          path: target/tmp/fidelity/
          if-no-files-found: warn
          retention-days: 30
      # The same tests once more with the rights of root, so that both ways of running a scenario are tested
      # (an ordinary user runs it in a user namespace, root with its own rights, D-022). The environment is
      # passed on: `sudo` would drop the toolchain and the `PATH` with the newer `tc`.
      - name: Kernel backend tests as root
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "CI=$CI" "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" "TC_LIB_DIR=$TC_LIB_DIR" just test-kernel
      # The step above left files in target/ that belong to root. The cache is saved at the end of the job by
      # the user of the runner, and `tar` fails on files it may not read (the cache was silently not saved).
      - name: Give target/ back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target

  docs:
    name: Documentation (rustdoc)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0
      - run: just doc

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0,cargo-deny@0.20.2
      - run: just deny

  # What `cargo publish` does before it uploads (REL-01): package every crate that is published, in dependency
  # order, and build each from its package. A pull request that makes a crate unpublishable fails here, not on
  # the day of a release.
  package:
    name: Packages (cargo publish --dry-run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0
      - run: just publish-dry-run

  # Does a pull request break the public API of the two libraries (QA-07, docs/VERSIONING.md)? A change is
  # compared with `main`, so that only the pull request that breaks something is blamed for it, and a break is
  # allowed when its title says so (`feat!:`), as the policy of the project asks. The pull request of a release
  # is compared with the last release on crates.io instead: the new version number has to fit everything
  # that is in it. Only the two libraries are checked; the other crates are published for the programs.
  semver:
    name: API (cargo-semver-checks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history of the base branch, to build the API of `main` from it
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: cargo-semver-checks@0.51.0
      - name: No break of the API that the title does not admit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.base_ref }}
        run: |
          release='^chore: release '
          breaking='^[a-z]+(\([^)]*\))?!:'
          if [[ "$TITLE" =~ $release ]]; then
            baseline=()
            echo "A release: compared with the last release on crates.io"
          else
            baseline=(--baseline-rev "origin/$BASE")
            echo "Compared with $BASE"
          fi
          status=0
          cargo semver-checks check-release --package netscenario-model --package netscenario-core "${baseline[@]}" || status=$?
          # 0: nothing breaks. 100: something breaks. Anything else is an error of the tool
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 100 ] && [[ ! "$TITLE" =~ $release ]] && [[ "$TITLE" =~ $breaking ]]; then
            echo "::notice::The API breaks, and the title of the pull request says so (!)"
            exit 0
          fi
          if [ "$status" -eq 100 ]; then
            echo "::error::The public API of netscenario-model or netscenario-core breaks (see above). If that is meant, put an exclamation mark in the title (feat!: ...) so that the changelog says Breaking; in a release, the version number has to be raised"
          fi
          exit "$status"

  # The Python packages build the native module with maturin, so this job needs Rust as well
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          tools: just@1.40.0
      # The Python tests run scenarios in network namespaces, as the Rust tests do
      - uses: ./.github/actions/namespaces
      - run: just py-check

  # The wheels (PYT-08), built and installed into clean environments: .github/workflows/wheels.yml, which
  # release.yml uses as well
  wheels:
    name: Wheels
    uses: ./.github/workflows/wheels.yml

  # The workflows are code too: syntax, expressions and the shell scripts in them. The binary is pinned
  # by version and checksum.
  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
      - run: ./actionlint -color

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Branch protection requires only this job, so new jobs are added to "needs" without touching the
  # repository settings. Every job has to succeed; only the two jobs that run on pull requests alone (the
  # dependency review and the check of the API) may be skipped.
  ci-ok:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, docs, deny, package, semver, python, wheels, actionlint, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the result of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Every job has to succeed; only the jobs of pull requests may be skipped (push to main)
          if echo "$NEEDS" | jq -e 'to_entries | map(select(.value.result != "success" and ((.key != "dependency-review" and .key != "semver") or .value.result != "skipped"))) | length == 0' > /dev/null; then
            echo "All required jobs succeeded"
          else
            echo "A required job did not succeed"
            exit 1
          fi
