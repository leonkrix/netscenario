name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  fmt:
    name: Format (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0
      - run: just fmt-check

  clippy:
    name: Lints (clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0
      - run: just clippy

  # The tests run on both Ubuntu images that the project supports and with the current stable Rust and
  # with the lowest supported one (rust-version in Cargo.toml, 1.89)
  test:
    name: Tests (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        rust: [stable, 1.89.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ matrix.rust }}
          tools: just@1.40.0,cargo-nextest@0.9.150
      # A tc that knows the seed of netem, and the permission to create user namespaces
      - uses: ./.github/actions/namespaces
      - run: just test
      # What the fidelity tests measured on this runner (QA-06, docs/FIDELITY.md): one table for each test job,
      # to be compared with the table in the repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fidelity-${{ matrix.os }}-rust-${{ matrix.rust }}
          path: target/tmp/fidelity/
          if-no-files-found: warn
          retention-days: 30
      # The same tests once more with the rights of root, so that both ways of running a scenario are tested
      # (an ordinary user runs it in a user namespace, root with its own rights, D-022). The environment is
      # passed on: `sudo` would drop the toolchain and the `PATH` with the newer `tc`.
      - name: Kernel backend tests as root
        run: |
          sudo env "PATH=$PATH" "HOME=$HOME" "CI=$CI" "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" "TC_LIB_DIR=$TC_LIB_DIR" just test-kernel

  docs:
    name: Documentation (rustdoc)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0
      - run: just doc

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just@1.40.0,cargo-deny@0.20.2
      - run: just deny

  # The Python packages build the native module with maturin, so this job needs Rust as well
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.python }}
          tools: just@1.40.0
      # The Python tests run scenarios in network namespaces, as the Rust tests do
      - uses: ./.github/actions/namespaces
      - run: just py-check

  # The wheels (PYT-08): the extension module, the supervisor `netscenario` and the agent, built in the
  # manylinux containers of the PyPA on a runner of each architecture, so that the programs link only to
  # the C library of an old distribution (glibc 2.28) and run on every newer one. The programs are built
  # first and copied into the package; maturin puts them in the wheel (python/netscenario/pyproject.toml).
  wheels:
    name: Wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          manylinux: 2_28
          rust-toolchain: stable
          working-directory: python/netscenario
          args: --release --out ../../dist
          # Runs in the container, in the working directory, after Rust is installed
          before-script-linux: |
            (
              cd ../..
              cargo build --release -p netscenario-cli -p netscenario-agent
              mkdir -p python/netscenario/src/netscenario/_bin
              cp target/release/netscenario target/release/netscenario-agent python/netscenario/src/netscenario/_bin/
            )
      - name: What is in the wheel
        run: |
          ls -l dist
          python3 -m zipfile --list dist/*.whl | grep -E '_bin/|_native|entry_points'
          # The tag says which C library the wheel needs: a manylinux wheel for this architecture, for the
          # stable ABI of Python 3.11. (maturin may name an older glibc than the container if the files
          # need nothing newer.)
          case "$(ls dist/*.whl)" in
            *-cp311-abi3-manylinux_*_${{ matrix.arch }}*.whl) ;;
            *) echo "unexpected tag: $(ls dist/*.whl)"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  # A wheel is only worth something if it works where it is installed: into a clean environment, on other
  # images than it was built on, with no checkout on the path. The smoke script runs a scenario through the
  # installed package, the installed command and the installed plugin (python/smoke/wheel_smoke.py).
  wheel-test:
    name: Wheel on ${{ matrix.runner }} (Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64, python: '3.11' }
          - { runner: ubuntu-24.04, arch: x86_64, python: '3.14' }
          - { runner: ubuntu-24.04-arm, arch: aarch64, python: '3.12' }
    steps:
      # The checkout is only for the smoke script, the composite action and the build of the plugin; the
      # package under test comes from the wheel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/namespaces
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.arch }}
          path: dist
      - name: Build the plugin (pure Python)
        run: uv build --package pytest-netscenario --out-dir dist
      - name: Install into a clean environment and run a scenario
        run: |
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/netscenario-*.whl dist/pytest_netscenario-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -I "$GITHUB_WORKSPACE/python/smoke/wheel_smoke.py"

  # The workflows are code too: syntax, expressions and the shell scripts in them. The binary is pinned
  # by version and checksum.
  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          curl --fail --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar --extract --gzip --file actionlint.tar.gz actionlint
      - run: ./actionlint -color

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Branch protection requires only this job, so new jobs are added to "needs" without touching the
  # repository settings. Every job has to succeed; only the dependency review may be skipped, because it
  # runs on pull requests alone.
  ci-ok:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, docs, deny, python, wheels, wheel-test, actionlint, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check the result of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Every job has to succeed; only the dependency review may be skipped (push to main)
          if echo "$NEEDS" | jq -e 'to_entries | map(select(.value.result != "success" and (.key != "dependency-review" or .value.result != "skipped"))) | length == 0' > /dev/null; then
            echo "All required jobs succeeded"
          else
            echo "A required job did not succeed"
            exit 1
          fi
