version: 2

# The ecosystem for Python (pip) is added with the first pyproject.toml, because Dependabot reports an
# error for a manifest that does not exist yet.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
    groups:
      rust:
        patterns: ['*']
