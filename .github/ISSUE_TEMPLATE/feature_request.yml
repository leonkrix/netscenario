name: Feature request
description: Something you would like netscenario to do.
labels: [enhancement]
body:
  - type: textarea
    id: use
    attributes:
      label: What do you test, and what is missing?
      description: The network situation you cannot describe, or the measurement you cannot make.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it look?
      description: A sketch of the scenario or the assertion, if you have one.
  - type: input
    id: ledger
    attributes:
      label: Line in FEATURES.md, if there is one
