name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: The scenario and the command
      description: The scenario file (as small as you can make it) and the command or test that ran it.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of netscenario
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kernel (`uname -r`), distribution, `tc -V`, and whether you run as root, in a user namespace or in a container.
    validations:
      required: true
