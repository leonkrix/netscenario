version: 0
name: t
duration: 10s
topology:
  nodes: [client, server]
  links:
    - id: access
      between: [client, server]
      forward:
        loss: { model: gilbert-elliott, p: 2%, r: 30%, loss-bad: 150%, loss-good: 0% }
workloads:
  - id: media
    kind: udp-cbr
    from: client
    to: server
    rate: 1mbit
    packet-size: 1200b
