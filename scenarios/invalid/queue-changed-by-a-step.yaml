version: 0
name: t
duration: 10s
topology:
  nodes: [client, server]
  links:
    - id: access
      between: [client, server]
      forward: { rate: 2mbit, queue: { limit: 50p } }
workloads:
  - { id: media, kind: udp-cbr, from: client, to: server, rate: 1mbit, packet-size: 1000b }
timeline:
  - { at: 2s, link: access, set: { forward: { queue: { limit: 10p } } } }
