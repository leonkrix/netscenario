version: 0
name: t
duration: 10s
topology:
  nodes: [client, server]
  links:
    - id: access
      between: [client, server]
workloads:
  - id: media
    kind: udp-cbr
    from: client
    to: server
    rate: 1mbit
    packet-size: 1200b
  - id: app
    kind: command
    node: server
    run: ["./server"]
    ready: { delay: 1s, within: 5s }
