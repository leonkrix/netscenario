# yaml-language-server: $schema=../docs/schema/scenario-v0.json
# A radio hop with bursts of loss, a little reordering, duplication and corruption, and, the other way round, the
# four-state model of loss. The keys are those of `netem` (docs/SCENARIO-FORMAT.md). A corrupted packet is dropped
# by the receiving node; the result tells those from the packets lost in the queue (`directions`, docs/RESULTS.md).
version: 0
name: noisy-radio
seed: 11
duration: 30s
topology:
  nodes: [phone, server]
  links:
    - id: radio
      between: [phone, server]
      forward:
        delay: 40ms
        loss: { model: gilbert-elliott, p: 2%, r: 30%, loss-bad: 50%, loss-good: 0.1% }
        reorder: { share: 5% }
        duplicate: 0.5%
        corrupt: 0.5%
      reverse:
        delay: 40ms
        loss: { model: markov4, p13: 2%, p31: 30%, p32: 10%, p23: 20%, p14: 0.5% }
workloads:
  - id: upload
    kind: udp-cbr
    from: phone
    to: server
    rate: 1mbit
    packet-size: 1000b
