# yaml-language-server: $schema=../docs/schema/scenario-v0.json
# A radio hop with bursts of loss, a little reordering and duplication, and, the other way round, the four-state
# model of loss. The keys are those of `netem` (docs/SCENARIO-FORMAT.md). Corruption (`corrupt`) is read by the
# format and applied by the Kernel backend from step 4.2b; until then `netscenario run` refuses it, so this file
# leaves it out.
version: 0
name: noisy-radio
seed: 11
duration: 30s
topology:
  nodes: [phone, server]
  links:
    - id: radio
      between: [phone, server]
      forward:
        delay: 40ms
        loss: { model: gilbert-elliott, p: 2%, r: 30%, loss-bad: 50%, loss-good: 0.1% }
        reorder: { share: 5% }
        duplicate: 0.5%
      reverse:
        delay: 40ms
        loss: { model: markov4, p13: 2%, p31: 30%, p32: 10%, p23: 20%, p14: 0.5% }
workloads:
  - id: upload
    kind: udp-cbr
    from: phone
    to: server
    rate: 1mbit
    packet-size: 1000b
