# A link that is limited to 2 mbit from the tenth second, goes quiet for two seconds, and is not limited any more
# from the twenty-fifth (`null` takes an impairment away).
# The timeline arrives with release 0.2: the Kernel backend applies it from step 4.3, until then
# `netscenario run` refuses the file and names the feature, and `validate` accepts it.
version: 0
name: bandwidth-drop-and-outage
seed: 3
duration: 30s
topology:
  nodes: [client, server]
  links:
    - id: access
      between: [client, server]
      both:
        delay: 20ms
workloads:
  - id: media
    kind: udp-cbr
    from: client
    to: server
    rate: 4mbit
    packet-size: 1200b
timeline:
  - { at: 10s, link: access, set: { both: { rate: 2mbit } } }
  - { at: 20s, link: access, outage: 2s }
  - { at: 25s, link: access, set: { both: { rate: null } } }
