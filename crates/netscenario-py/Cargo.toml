[package]
name = "netscenario-py"
description = "The Python bindings of netscenario (PyO3), built into the package netscenario by maturin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as the wheels of the package netscenario (maturin), not as a crate (REL-01)
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# An extension module cannot be linked into a test program without Python, and it has no Rust tests: the
# Python tests in python/ cover it
test = false
doctest = false

[dependencies]
# abi3: one wheel per platform serves every Python version from 3.11 on (D-017). The build as an extension
# module is switched on in .cargo/config.toml and by maturin, not by a feature of this crate.
pyo3 = { version = "0.30", features = ["abi3-py311"] }
netscenario-core.workspace = true
netscenario-model.workspace = true
netscenario-backend-kernel.workspace = true
serde_json.workspace = true

[lints]
workspace = true
