[package]
name = "netscenario-backend-kernel"
description = "The Kernel backend of netscenario: network namespaces, virtual Ethernet pairs and netem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
netscenario-core.workspace = true
netscenario-model.workspace = true
serde.workspace = true
serde_json.workspace = true
# The signal for the process group of a program: a safe call, no `unsafe` (D-025)
rustix = { workspace = true, features = ["process"] }
# Handlers for the signals a program may be sent, so that they are not ignored in the programs (below)
signal-hook.workspace = true

# The helper that a test starts as the supervisor of a run (D-022). An application starts its own binary
# that calls `supervisor::main`.
[dev-dependencies]
# The record file and the events of the agent are read by the tests that run it in namespaces
netscenario-agent.workspace = true

[[bin]]
name = "netscenario-kernel-supervisor"
path = "src/bin/supervisor.rs"

[lints]
workspace = true
