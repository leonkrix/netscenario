[workspace]
resolver = "3"
members = ["crates/*"]
# The spikes are scratch crates with a workspace of their own
exclude = ["spikes"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
# The lowest supported Rust version (D-020, which raised it from 1.85 of D-014). It is what serde-saphyr, the
# YAML parser of the scenario files, needs.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leonkrix/netscenario"
homepage = "https://github.com/leonkrix/netscenario"
readme = "README.md"
keywords = ["network", "emulation", "netem", "testing", "scenario"]
categories = ["development-tools::testing", "network-programming", "simulation"]

[workspace.dependencies]
netscenario-model = { path = "crates/netscenario-model", version = "0.1.0-rc.2" }
netscenario-core = { path = "crates/netscenario-core", version = "0.1.0-rc.2" }
netscenario-backend-kernel = { path = "crates/netscenario-backend-kernel", version = "0.1.0-rc.2" }
netscenario-agent = { path = "crates/netscenario-agent", version = "0.1.0-rc.2" }
netscenario-cli = { path = "crates/netscenario-cli", version = "0.1.0-rc.2" }

# Third-party dependencies are listed once here; a crate says `name.workspace = true`
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The agent reads the clock and sets socket buffers through this safe interface, so no crate of ours needs `unsafe`
rustix = { version = "1", default-features = false, features = ["std", "time", "net"] }
serde-saphyr = "2"
# The parser that serde-saphyr uses; read directly to find the position of every value in the file
granit-parser = "2"
schemars = "1"
thiserror = "2"
# Test tools
insta = { version = "1", features = ["glob"] }
proptest = "1"
# Checks that the example scenarios satisfy the generated schema
jsonschema = { version = "0.60", default-features = false }

[workspace.lints.rust]
# A crate that needs `unsafe` (the engine, the bindings) overrides this in its own Cargo.toml and says why
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code does not print: it returns data or writes to a writer it was given
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
